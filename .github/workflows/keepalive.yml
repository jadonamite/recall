# The shared node runs on a Render free instance, which sleeps after 15 minutes
# idle and then takes 30–60s to answer its first request. A judge clicking
# "Run a live recall" should not be the request that wakes it, so ping it.
name: keep the shared node awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: GET /healthz
        run: |
          for attempt in 1 2 3; do
            body=$(curl -fsS -m 90 https://recall-node.onrender.com/healthz) && {
              echo "$body"
              echo "$body" | grep -q '"ok":true' && exit 0
            }
            echo "attempt $attempt failed, retrying"
            sleep 20
          done
          echo "the node did not answer" >&2
          exit 1
